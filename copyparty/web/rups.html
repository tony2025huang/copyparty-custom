<!DOCTYPE html>
<html lang="{{ 'zh-CN' if lang == 'chi' else 'en' }}" id="ht_rup">

<head>
	<meta charset="utf-8">
	<title>{{ s_doctitle }}</title>
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=0.8">
	<meta name="robots" content="noindex, nofollow">
	<meta name="theme-color" content="#{{ tcolor }}">
	<link rel="stylesheet" media="screen" href="{{ r }}/.cpr/w/rups.css?_={{ ts }}">
	<link rel="stylesheet" media="screen" href="{{ r }}/.cpr/w/ui.css?_={{ ts }}">
	<link rel="stylesheet" media="screen" href="{{ r }}/.cpr/w/custom-modern.css?_={{ ts }}">
{{ html_head }}
</head>

<body>
	<div id="wrap">
		<a href="#" id="re" data-i18n="refresh">refresh</a>
		<a href="{{ r }}/?h" data-i18n="control_panel">control-panel</a>
		&nbsp; <span data-i18n="filter">Filter</span>: <input type="text" id="filter" size="20" data-i18n-placeholder="filter" placeholder="documents/passwords" />
        &nbsp; <span id="hits"></span>
        <div id="tw"></div>
    </div>
	<a href="#" id="repl">π</a>
	<script nonce="{{ js_nonce }}">

var SR="{{ r }}",
	JS_NONCE = "{{ js_nonce }}",
	lang="{{ lang }}",
    dutc={{ this.args.js_utc }},
	dfavico="{{ favico }}";

var STG = window.localStorage;
document.documentElement.className = (STG && STG.cpp_thm) || "{{ this.args.theme }}";

</script>
<script nonce="{{ js_nonce }}" src="{{ r }}/.cpr/w/util.js?_={{ ts }}"></script>
<script nonce="{{ js_nonce }}" src="{{ r }}/.cpr/w/i18n.js?_={{ ts }}"></script>
<script nonce="{{ js_nonce }}">var V={{ v }};</script>
<script nonce="{{ js_nonce }}" src="{{ r }}/.cpr/w/rups.js?_={{ ts }}"></script>
{%- if js %}
<script nonce="{{ js_nonce }}" src="{{ js }}_={{ ts }}"></script>
{%- endif %}
<script nonce="{{ js_nonce }}">
	Date.now();function jsldp(a,b){2!=window[a]&&alert("FATAL ERROR: cannot load "+b+".js due to unreliable network or broken reverse-proxy; try CTRL-SHIFT-R")}
	jsldp("J_UTL","util");
	jsldp("J_RUP","rups");
</script>
</body>
</html>
