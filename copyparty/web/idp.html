<!DOCTYPE html>
<html lang="{{ 'zh-CN' if lang == 'chi' else 'en' }}" id="ht_idp">

<head>
	<meta charset="utf-8">
	<title>{{ s_doctitle }}</title>
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=0.8">
    <meta name="robots" content="noindex, nofollow">
	<meta name="theme-color" content="#{{ tcolor }}">
	<link rel="stylesheet" media="screen" href="{{ r }}/.cpr/w/shares.css?_={{ ts }}">
	<link rel="stylesheet" media="screen" href="{{ r }}/.cpr/w/ui.css?_={{ ts }}">
{{ html_head }}
</head>

<body>
	<div id="wrap">
		<a href="{{ r }}/?idp" data-i18n="refresh">refresh</a>
		<a href="{{ r }}/?h" data-i18n="control_panel">control-panel</a>

        <table id="tab"><thead><tr>
			<th data-i18n="forget">forget</th>
			<th data-i18n="user">user</th>
			<th data-i18n="groups">groups</th>
        </tr></thead><tbody>
        {%- for un, gn in rows %}
        <tr>
            <td><a href="{{ r }}/?idp=rm={{ un|e }}" data-i18n="forget">forget</a></td>
            <td>{{ un|e }}</td>
            <td>{{ gn|e }}</td>
        </tr>
        {%- endfor %}
        </tbody></table>
        {%- if not rows %}
		<span data-i18n="no_idp_users">there are no IdP users in the cache</span>
        {%- endif %}
    </div>
	<a href="#" id="repl">π</a>
	<script nonce="{{ js_nonce }}">

var SR="{{ r }}",
	JS_NONCE = "{{ js_nonce }}",
	lang="{{ lang }}",
	dfavico="{{ favico }}";

var STG = window.localStorage;
document.documentElement.className = (STG && STG.cpp_thm) || "{{ this.args.theme }}";

</script>
<script nonce="{{ js_nonce }}" src="{{ r }}/.cpr/w/util.js?_={{ ts }}"></script>
<script nonce="{{ js_nonce }}" src="{{ r }}/.cpr/w/i18n.js?_={{ ts }}"></script>
{%- if js %}
<script nonce="{{ js_nonce }}" src="{{ js }}_={{ ts }}"></script>
{%- endif %}
<script nonce="{{ js_nonce }}">
    Date.now();function jsldp(a,b){2!=window[a]&&alert("FATAL ERROR: cannot load "+b+".js due to unreliable network or broken reverse-proxy; try CTRL-SHIFT-R")}
    jsldp("J_UTL","util");
</script>
</body>
</html>
